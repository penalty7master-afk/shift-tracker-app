name: Build Flet Android APK (arm64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Flet 0.86 по умолчанию берёт CPython 3.14 — принудительно возвращаем 3.12
  SERIOUS_PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "flet[all]==0.86.5"

    - name: Syntax check
      run: |
        python -m compileall -q .

    - name: Import smoke test
      run: |
        python -c "import ui; print('Импорты в порядке')"

    - name: Setup Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Build Android APK (arm64-v8a, Python 3.12)
      run: |
        flet build apk . --project "shifts_pro" --module-name main --python-version 3.12 --arch arm64-v8a --yes -v

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v5
      with:
        name: calendar-shifts-pro-apk
        path: build/apk/*.apk
