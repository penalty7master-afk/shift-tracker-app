name: Build Flet Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # flet-cli нужен отдельно: пакет flet ставит только рантайм, без команды "flet build"
        pip install "flet[all]==0.86.5"

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build Android APK
      run: |
        flet build apk . --project "shifts_pro" --module-name main --yes

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: calendar-shifts-pro-apk
        path: build/apk/*.apk
